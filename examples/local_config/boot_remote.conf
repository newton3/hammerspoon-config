# Copy to ~/.hammerspoon/local_config/boot_remote.conf and fill every blank.
# This file is sourced by zsh. Keep values single-quoted; represent a literal
# apostrophe as: '\''

# Include the username explicitly, for example alice@linux-box.local.
OMARCHY_SSH_TARGET=''
WINDOWS_SSH_TARGET=''

# Use the exact quoted entry names shown by:
# grep -E '^menuentry' /boot/grub/grub.cfg
GRUB_WINDOWS_ENTRY=''
GRUB_OMARCHY_ENTRY=''

EFI_OVERRIDE_PATH='/boot/efi/nextboot.cfg'
WINDOWS_EFI_DRIVE='S'
SSH_CONNECT_TIMEOUT='7'
